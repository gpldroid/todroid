<body class="min-h-screen bg-[#080a11] text-gray-100 antialiased">
<div data-shared-header></div>
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
<section class="relative rounded-3xl p-6 md:p-8 overflow-hidden glass-panel border border-amber-500/20 shadow-2xl bg-gradient-to-r from-gray-950 via-amber-950/20 to-gray-950 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
<div class="space-y-2 max-w-2xl">
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/15 text-amber-300 text-xs font-bold border border-amber-500/30"><i class="fa-solid fa-layer-group text-amber-400"></i> Android Application Starter Kits</div>
<h1 class="text-2xl md:text-3xl font-black text-white">10 Pre-Configured <span class="gradient-text">Android App Templates</span></h1>
<p class="text-gray-400 text-xs leading-relaxed">Select any ready-to-edit template to load its URL, branding, package ID, theme, splash screen, and recommended configuration in the Studio Builder.</p>
</div>
<a href="../../index.html" class="px-5 py-2.5 bg-gray-900 hover:bg-gray-800 text-gray-200 border border-gray-700 font-bold text-xs rounded-2xl transition whitespace-nowrap"><i class="fa-solid fa-arrow-left mr-1.5"></i> Custom Blank App</a>
</section>
<section class="mt-8">
<div id="templates-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</section>
</main>
<div data-shared-footer></div>
<script src="../../assets/js/layout.js" defer></script>
<script>
const templates = [
{id:'ecom',name:'StoreExpress Pro',category:'E-Commerce / Store',url:'https://wikipedia.org',pkg:'com.web2app.storeexpress',version:'1.0.0',color:'#e11d48',bg:'#0f172a',tag:'Your Premier Mobile Shopping Experience',icon:'https://placehold.co/128x128/e11d48/ffffff?text=SHOP',badge:'Popular',badgeBg:'bg-rose-500/20 text-rose-300 border-rose-500/30',desc:'Tailored for online stores & Shopify/WooCommerce apps with pull-to-refresh & storage permissions.'},
{id:'news',name:'TechPulse News',category:'News & Magazine',url:'https://news.ycombinator.com',pkg:'com.web2app.techpulse',version:'1.2.0',color:'#ea580c',bg:'#09090b',tag:'Breaking Technology & Global Headlines',icon:'https://placehold.co/128x128/ea580c/ffffff?text=NEWS',badge:'Featured',badgeBg:'bg-orange-500/20 text-orange-300 border-orange-500/30',desc:'Optimized news portal layout with fast loading and custom theme accent color.'},
{id:'food',name:'TastyBites Bistro',category:'Restaurant & Delivery',url:'https://bento.me',pkg:'com.web2app.tastybites',version:'1.0.0',color:'#dc2626',bg:'#18181b',tag:'Delicious Food Delivered to Your Doorstep',icon:'https://placehold.co/128x128/dc2626/ffffff?text=FOOD',badge:'Hot',badgeBg:'bg-red-500/20 text-red-300 border-red-500/30',desc:'Includes location permissions and smooth WebView navigation for online ordering.'},
{id:'saas',name:'DevHub Cloud Studio',category:'SaaS Dashboard',url:'https://github.com',pkg:'com.web2app.devhub',version:'2.0.0',color:'#3b82f6',bg:'#020617',tag:'Cloud Developer Platform & Workspaces',icon:'https://placehold.co/128x128/3b82f6/ffffff?text=SAAS',badge:'Productivity',badgeBg:'bg-blue-500/20 text-blue-300 border-blue-500/30',desc:'Designed for SaaS platforms and enterprise tools with bottom controls enabled.'},
{id:'edu',name:'EduAcademy Online',category:'E-Learning Portal',url:'https://khanacademy.org',pkg:'com.web2app.eduacademy',version:'1.1.0',color:'#059669',bg:'#064e3b',tag:'Learn Courses & Master Skills Anywhere',icon:'https://placehold.co/128x128/059669/ffffff?text=EDU',badge:'Education',badgeBg:'bg-emerald-500/20 text-emerald-300 border-emerald-500/30',desc:'Full-screen educational portal template with media & camera permissions.'},
{id:'fitness',name:'FitTrack Health App',category:'Fitness & Health',url:'https://fitnotes.net',pkg:'com.web2app.fittrack',version:'1.0.5',color:'#7c3aed',bg:'#2e1065',tag:'Track Workouts & Daily Health Goals',icon:'https://placehold.co/128x128/7c3aed/ffffff?text=FIT',badge:'Health',badgeBg:'bg-purple-500/20 text-purple-300 border-purple-500/30',desc:'Pre-configured theme with vibrant violet accents for fitness trackers.'},
{id:'community',name:'CommUnity Forum',category:'Social Network',url:'https://reddit.com',pkg:'com.web2app.communityhub',version:'1.3.0',color:'#2563eb',bg:'#0f172a',tag:'Connect & Discuss in Global Communities',icon:'https://placehold.co/128x128/2563eb/ffffff?text=SOC',badge:'Social',badgeBg:'bg-indigo-500/20 text-indigo-300 border-indigo-500/30',desc:'Ideal for community forums, discussion boards, and social platforms.'},
{id:'realestate',name:'UrbanHomes Finder',category:'Real Estate',url:'https://zillow.com',pkg:'com.web2app.urbanhomes',version:'1.0.0',color:'#0284c7',bg:'#082f49',tag:'Find Dream Apartments & Luxury Homes',icon:'https://placehold.co/128x128/0284c7/ffffff?text=HOME',badge:'Property',badgeBg:'bg-sky-500/20 text-sky-300 border-sky-500/30',desc:'Includes location map integration and custom launcher branding.'},
{id:'streaming',name:'SoundWave Music',category:'Media Streaming',url:'https://soundcloud.com',pkg:'com.web2app.soundwave',version:'2.1.0',color:'#d97706',bg:'#451a03',tag:'Stream Underground Tracks & Podcasts',icon:'https://placehold.co/128x128/d97706/ffffff?text=PLAY',badge:'Media',badgeBg:'bg-amber-500/20 text-amber-300 border-amber-500/30',desc:'Streaming app layout configured with pull refresh and storage support.'},
{id:'portfolio',name:'Creative Portfolio',category:'Freelancer Portfolio',url:'https://dribbble.com',pkg:'com.web2app.creativeshowcase',version:'1.0.0',color:'#db2777',bg:'#18181b',tag:'Showcase Designs, Works & Projects',icon:'https://placehold.co/128x128/db2777/ffffff?text=PORT',badge:'Creative',badgeBg:'bg-pink-500/20 text-pink-300 border-pink-500/30',desc:'Sleek portfolio showcase template for designers and agency websites.'}
];
const grid=document.getElementById('templates-grid');
grid.innerHTML=templates.map(t=>`
<article class="glass-panel p-5 rounded-3xl border border-gray-800 hover:border-brand-500/40 transition-all space-y-4 flex flex-col justify-between group">
<div class="space-y-3">
<div class="flex items-start justify-between gap-2">
<div class="flex items-center gap-3"><img src="${t.icon}" alt="${t.name}" width="48" height="48" loading="lazy" class="w-12 h-12 rounded-2xl object-cover border border-gray-700 shadow-md group-hover:scale-105 transition-transform"><div><h2 class="text-white font-bold text-sm leading-tight">${t.name}</h2><span class="text-[10px] text-gray-400 font-mono">${t.pkg}</span></div></div>
<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${t.badgeBg}">${t.badge}</span>
</div>
<div class="text-[11px] text-amber-400/90 font-semibold flex items-center gap-1.5"><i class="fa-solid fa-tag text-xs"></i> ${t.category}</div>
<p class="text-xs text-gray-400 leading-relaxed">${t.desc}</p>
<div class="bg-gray-950/80 p-3 rounded-2xl border border-gray-900 text-xs space-y-1 font-mono text-gray-300">
<div class="flex justify-between items-center text-[11px]"><span class="text-gray-500">Color Accent:</span><span class="flex items-center gap-1 font-bold"><span class="w-3 h-3 rounded-full inline-block border border-gray-700" style="background-color:${t.color}"></span>${t.color}</span></div>
<div class="flex justify-between items-center text-[11px]"><span class="text-gray-500">Target Web URL:</span><span class="text-brand-400 truncate max-w-[140px]">${t.url}</span></div>
</div></div>
<button type="button" onclick="useTemplate('${t.id}')" class="w-full py-2.5 bg-gradient-to-r from-amber-600 via-brand-600 to-indigo-600 hover:from-amber-500 hover:to-indigo-500 text-white font-bold text-xs rounded-xl shadow-lg transition flex items-center justify-center gap-2"><i class="fa-solid fa-wand-magic-sparkles"></i> Use & Edit Template</button>
</article>`).join('');
function useTemplate(id){
 const t=templates.find(x=>x.id===id); if(!t)return;
 try{localStorage.setItem('web2app-pending-template',JSON.stringify(t));}catch(e){}
 window.location.href='../../index.html?template='+encodeURIComponent(id);
}
</script>
</body>
</html>
