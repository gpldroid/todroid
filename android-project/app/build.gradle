plugins {
    id "com.android.application"
}

def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def keystorePassword = System.getenv("KEYSTORE_PASSWORD")
def keyAlias = System.getenv("KEY_ALIAS")
def keyPassword = System.getenv("KEY_PASSWORD")
def signingReady = keystorePath && keystorePassword && keyAlias && keyPassword

android {
    namespace "com.web2app.ci"
    compileSdk 35

    defaultConfig {
        applicationId "com.web2app.ci"
        minSdk 24
        targetSdk 35
        versionCode 10000
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (signingReady) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// Keep all Kotlin runtime modules on one compatible version. Some AndroidX/Gradle
// transitive dependencies can otherwise pull legacy kotlin-stdlib-jdk7/jdk8 artifacts.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin") {
            details.useVersion "1.8.22"
            details.because("Avoid duplicate Kotlin stdlib classes from mixed runtime versions")
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.12.1"
}
