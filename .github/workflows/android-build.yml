name: Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "android-project/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-project/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android-project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Validate Android project
        run: gradle --no-daemon help

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build release AAB
        run: gradle --no-daemon :app:bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web2app-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: web2app-release-aab
          path: android-project/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
