name: Android Build

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name"
        required: true
        default: "My Web App"
        type: string
      app_url:
        description: "HTTPS website URL"
        required: true
        default: "https://example.com"
        type: string
      package_name:
        description: "Android package ID"
        required: true
        default: "com.web2app.app"
        type: string
      version_name:
        description: "Version"
        required: true
        default: "1.0.0"
        type: string
      primary_color:
        description: "Primary color"
        required: true
        default: "#4F46E5"
        type: string
      camera:
        description: "Enable camera and microphone"
        required: true
        default: true
        type: boolean
      location:
        description: "Enable location"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android-project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Studio configuration
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_URL: ${{ inputs.app_url }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          VERSION_NAME: ${{ inputs.version_name }}
          PRIMARY_COLOR: ${{ inputs.primary_color }}
          CAMERA: ${{ inputs.camera }}
          LOCATION: ${{ inputs.location }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          from xml.sax.saxutils import escape

          root = Path(".")
          name = os.environ["APP_NAME"].strip() or "My Web App"
          url = os.environ["APP_URL"].strip()
          package = os.environ["PACKAGE_NAME"].strip().lower()
          version = os.environ["VERSION_NAME"].strip() or "1.0.0"
          color = os.environ["PRIMARY_COLOR"].strip() or "#4F46E5"
          camera = os.environ["CAMERA"].lower() == "true"
          location = os.environ["LOCATION"].lower() == "true"

          if not re.fullmatch(r"https://[^\s]+", url, re.I):
              raise SystemExit("APP_URL must use HTTPS")
          if not re.fullmatch(r"[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+", package):
              raise SystemExit("PACKAGE_NAME is not a valid Android package")
          if not re.fullmatch(r"#?[0-9a-fA-F]{6}", color):
              raise SystemExit("PRIMARY_COLOR must be a 6-digit hex color")
          color = "#" + color.lstrip("#")

          parts = [p for p in package.split(".") if p]
          java_dir = root / "app/src/main/java" / Path(*parts)
          java_dir.mkdir(parents=True, exist_ok=True)
          java = root / "app/src/main/java/com/web2app/ci/MainActivity.java"
          if java.exists():
              content = java.read_text()
              content = re.sub(r"^package\s+[^;]+;", f"package {package};", content, count=1, flags=re.M)
              content = content.replace("https://example.com", url)
              java_target = java_dir / "MainActivity.java"
              java_target.write_text(content)
              if java_target != java:
                  java.unlink()

          gradle = root / "app/build.gradle"
          g = gradle.read_text()
          g = re.sub(r'namespace\s+"[^"]+"', f'namespace "{package}"', g, count=1)
          g = re.sub(r'applicationId\s+"[^"]+"', f'applicationId "{package}"', g, count=1)
          g = re.sub(r'versionName\s+"[^"]+"', f'versionName "{version}"', g, count=1)
          gradle.write_text(g)

          strings = root / "app/src/main/res/values/strings.xml"
          strings.write_text(f"""<resources>
              <string name="app_name">{escape(name)}</string>
              <string name="target_url">{escape(url)}</string>
          </resources>
          """)

          colors = root / "app/src/main/res/values/colors.xml"
          colors.write_text(f"""<resources>
              <color name="primary">{color}</color>
          </resources>
          """)

          manifest = root / "app/src/main/AndroidManifest.xml"
          m = manifest.read_text()
          permission_block = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if camera:
              permission_block += '    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if location:
              permission_block += '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
          m = re.sub(r'\s*<uses-permission\b[^>]*/>\s*', '\n', m)
          application_pos = m.find("    <application")
          if application_pos == -1:
              raise SystemExit("AndroidManifest.xml is missing <application>")
          m = m[:application_pos] + permission_block + m[application_pos:]
          manifest.write_text(m)

          print(f"Configured {name} | {package} | {version} | {url}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Validate Android project
        run: gradle --no-daemon help

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "::error::Missing KEYSTORE_BASE64 repository secret"
            exit 1
          }
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/release.keystore
          test -s signing/release.keystore || {
            echo "::error::Decoded keystore is empty"
            exit 1
          }

      - name: Validate release signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing KEY_ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing KEY_PASSWORD repository secret"; exit 1; }

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-project/signing/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-project/signing/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease

      - name: Verify signed release APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/*.apk

      - name: Verify signed release AAB
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/*.aab > /tmp/aab-signature.txt
          tail -n 20 /tmp/aab-signature.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: web2app-${{ inputs.app_name }}-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: web2app-${{ inputs.app_name }}-signed-release-apk
          path: android-project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: web2app-${{ inputs.app_name }}-signed-release-aab
          path: android-project/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup signing material
        if: always()
        run: rm -f signing/release.keystore
